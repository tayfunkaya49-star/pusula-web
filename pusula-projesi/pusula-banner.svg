    <path d="M120 0V320 M240 0V320 M360 0V320 M480 0V320 M600 0V320 M720 0V320 M840 0V320 M960 0V320 M1080 0V320" />
  </g>

  <rect width="1200" height="320" rx="24" fill="url(#glowTeal)" />
  <rect width="1200" height="320" rx="24" fill="url(#glowIndigo)" />

  <!-- Right-side Neural Constellation -->
  <g opacity="0.68">
    <path d="M880 76 L985 112 L1090 70 M880 76 L945 190 L1055 215 L1120 135 L1090 70 M985 112 L945 190 M985 112 L1120 135 M945 190 L1015 262 L1055 215" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1.5" />
    <circle cx="880" cy="76" r="5" fill="#2DD4BF" />
    <circle cx="985" cy="112" r="7" fill="#818CF8" />
    <circle cx="1090" cy="70" r="4.5" fill="#38BDF8" />
    <circle cx="945" cy="190" r="5.5" fill="#2DD4BF" />
    <circle cx="1055" cy="215" r="6" fill="#A5B4FC" />
    <circle cx="1120" cy="135" r="4.5" fill="#34D399" />
    <circle cx="1015" cy="262" r="4" fill="#F43F5E" />
