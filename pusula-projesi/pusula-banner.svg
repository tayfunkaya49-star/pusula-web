    <circle cx="102" cy="102" r="68" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6" />
    <circle cx="102" cy="102" r="52" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 5" />
    <polygon points="102,42 122,102 102,90 82,102" fill="#2DD4BF" />
    <polygon points="102,162 122,102 102,114 82,102" fill="#F43F5E" />
    <circle cx="102" cy="102" r="10" fill="#FFFFFF" />
