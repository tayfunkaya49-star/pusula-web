      <stop offset="52%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B2E33" />
    </linearGradient>
    <radialGradient id="glowTeal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(215 160) rotate(90) scale(170)">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
