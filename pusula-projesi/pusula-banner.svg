      <rect x="284" y="0" width="132" height="28" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="350" y="18" text-anchor="middle" fill="#38BDF8">Zero-Build PWA</text>

      <rect x="426" y="0" width="126" height="28" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="489" y="18" text-anchor="middle" fill="#FBBF24">Supabase + Gemini</text>
